name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        # cmd/{registry,beacon,rendezvous,nameserver,gateway,updater,pilot-ca}
        # were extracted to sibling pilot-protocol/* repos; only daemon
        # and pilotctl ship from this repo now.
        run: |
          go build ./cmd/daemon
          go build ./cmd/pilotctl

      - name: Test
        # tests/ has grown past the prior 900s ceiling: 30+ new
        # zz_*_test.go added coverage for accessors / edge paths,
        # local repro hits the 900s wall against ./tests/ too (not
        # just CI). Bumped to 1800s — matches the Coverage step
        # right below and the architecture-gates stress harness.
        # If this keeps creeping, split tests/ into faster slices
        # rather than continuing to bump the ceiling.
        run: |
          go test -parallel 4 -count=1 -timeout 1800s \
            -skip 'TestMultipleLargeWrites|TestConcurrentDialEncryptDecrypt|TestHTTPPrivateWithTrust|TestInviteInboxCapEnforced|TestConnectionLimits|TestRC6PeerRestartRecoveryEndToEnd|TestEndToEndRelay|TestNameserverOverwriteA|TestNameserverPersistence|TestNameserverRegisterN|TestNameserver$' \
            ./tests/

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd tests && go test -parallel 4 -count=1 -coverprofile=coverage.out -covermode=atomic -timeout 1800s
          go tool cover -func=coverage.out | tail -1
