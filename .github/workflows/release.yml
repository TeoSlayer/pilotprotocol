name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write          # PILOT-120: OIDC for SLSA attestation
  attestations: write      # PILOT-120: actions/attest-build-provenance

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # macos-latest dropped from the release test matrix: the hosted
        # runner's TMPDIR (/var/folders/.../T/) has been rejecting
        # t.TempDir() with EACCES on every release since the runner
        # image update in mid-May. Every test that touches a temp dir
        # fails immediately, blocking release tags. Darwin still gets
        # full coverage in the build matrix (darwin/amd64, darwin/arm64)
        # so we still ship signed mac binaries; macOS test coverage
        # continues in PR ci.yml and the nightly suite where the
        # runner behavior is the same but the gate is non-blocking.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build all binaries
        run: make build

      - name: Unit tests
        # Release gate runs the same -short unit suite as ci.yml so the
        # release pipeline validates the same coverage that PRs validate.
        # The previous gate ran the heavy integration suite in ./tests/
        # against loopback HTTP servers; that suite has been broken on
        # the GH Actions runner network stack for ~2 weeks (every
        # v1.10.1+ release run failed here), blocking every release tag
        # since 2026-05-16. Integration tests still run nightly via
        # nightly.yml and locally via `go test ./tests/`.
        run: go test -short -count=1 -timeout 600s ./pkg/... ./cmd/... ./internal/...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          BINS="daemon pilotctl updater"
          mkdir -p dist
          for bin in $BINS; do
            echo "Building $bin for ${{ matrix.goos }}/${{ matrix.goarch }}..."
            go build -ldflags "$LDFLAGS" -o dist/$bin ./cmd/$bin
          done

      # Ad-hoc codesign + drop quarantine on darwin builds so downloaded
      # binaries don't trigger "killed: 9" or Gatekeeper "cannot be opened
      # because Apple cannot check it for malicious software". Ad-hoc
      # signing is enough to make the binary launch — full notarization
      # would need APPLE_ID + APP_SPECIFIC_PASSWORD secrets and a paid
      # developer cert; out of scope for this release.
      - name: macOS ad-hoc codesign + strip quarantine
        if: matrix.goos == 'darwin'
        run: |
          for bin in dist/*; do
            echo "codesigning $bin..."
            codesign --force --deep --sign - "$bin"
            xattr -cr "$bin" || true
          done
          for bin in dist/*; do
            codesign -dv "$bin" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" | head -1
          done

      - name: Smoke test binaries
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64' || matrix.goos == 'darwin'
        run: |
          echo "=== Binary smoke tests ==="
          for bin in dist/*; do
            name=$(basename $bin)
            # Verify it's a valid executable
            file $bin
            # Version flag check (all binaries should accept -h without crashing)
            timeout 5 $bin -h 2>&1 || true
            echo "  ✓ $name"
          done

          echo ""
          echo "=== Daemon help test ==="
          dist/daemon -h 2>&1 | head -5
          echo "  ✓ daemon shows help"

          echo ""
          echo "=== pilotctl version test ==="
          dist/pilotctl version 2>&1 || dist/pilotctl -h 2>&1 | head -3
          echo "  ✓ pilotctl responds"

      - name: Package archive
        run: |
          ARCHIVE="pilot-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf $ARCHIVE -C dist .
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # PILOT-120: SLSA build provenance attestation via Sigstore.
      # Attests every release tarball + checksums.txt. Consumers (updater,
      # install.sh) can verify with `gh attestation verify` or `cosign`
      # to prove the artifact was built by THIS workflow on this repo,
      # not substituted somewhere downstream.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.tar.gz
            release/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

  # ---------------------------------------------------------------------------
  # Downstream fan-out. After the GitHub Release (binaries + checksums) is
  # published, propagate THIS tag's version to every distribution channel:
  # PyPI, npm, Homebrew. Each leg is independent: one failing channel does not
  # block the others, but every failure is surfaced (the final "gate" step
  # fails the job if any leg failed). Skipped for -rc/-beta prereleases.
  #
  # Version-locking: every channel publishes ${GITHUB_REF_NAME} (the daemon
  # tag), NOT the stale version sitting in each downstream repo's source.
  #
  # PyPI/npm are triggered via `gh workflow run publish.yml -f version=...`
  # against the SDK repos. This MUST use a cross-repo PAT — a release created
  # with GITHUB_TOKEN cannot trigger another repo's workflow, and GITHUB_TOKEN
  # has no write scope on sibling repos. See RELEASE_DISPATCH_TOKEN below.
  publish-downstream:
    name: Publish to PyPI / npm / Homebrew
    needs: release
    if: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compute version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"   >> "$GITHUB_OUTPUT"

      # --- PyPI -------------------------------------------------------------
      - name: Dispatch sdk-python publish
        id: pypi
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_DISPATCH_TOKEN is not set — cannot dispatch sdk-python"
            exit 1
          fi
          gh workflow run publish.yml \
            --repo pilot-protocol/sdk-python \
            --ref main \
            -f version="${{ steps.ver.outputs.version }}"
          echo "Dispatched sdk-python publish @ ${{ steps.ver.outputs.version }}"

      # --- npm --------------------------------------------------------------
      - name: Dispatch sdk-node publish
        id: npm
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_DISPATCH_TOKEN is not set — cannot dispatch sdk-node"
            exit 1
          fi
          gh workflow run publish.yml \
            --repo pilot-protocol/sdk-node \
            --ref main \
            -f version="${{ steps.ver.outputs.version }}"
          echo "Dispatched sdk-node publish @ ${{ steps.ver.outputs.version }}"

      # --- Homebrew ---------------------------------------------------------
      # Regenerate the formula from this release's checksums + tag and push it
      # to the tap. HOMEBREW_TAP_TOKEN must be a PAT with write access to the
      # tap repo (the tap is in a different owner, so GITHUB_TOKEN can't push).
      - name: Update Homebrew formula
        id: brew
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: TeoSlayer/homebrew-pilot
          FORMULA_PATH: Formula/pilotprotocol.rb
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set — cannot update the tap"
            exit 1
          fi
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --clobber
          cat checksums.txt

          sum() { grep "pilot-$1.tar.gz" checksums.txt | awk '{print $1}'; }
          DA=$(sum darwin-arm64); DX=$(sum darwin-amd64)
          LA=$(sum linux-arm64);  LX=$(sum linux-amd64)
          for v in "$DA" "$DX" "$LA" "$LX"; do
            [ -n "$v" ] || { echo "::error::missing checksum in checksums.txt"; exit 1; }
          done

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > pilotprotocol.rb <<RUBY
          class Pilotprotocol < Formula
            desc "The network stack for AI agents - addresses, ports, tunnels, encryption, trust"
            homepage "https://pilotprotocol.network"
            version "${VERSION}"
            license "AGPL-3.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/pilot-darwin-arm64.tar.gz"
                sha256 "${DA}"
              else
                url "${base}/pilot-darwin-amd64.tar.gz"
                sha256 "${DX}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base}/pilot-linux-arm64.tar.gz"
                sha256 "${LA}"
              else
                url "${base}/pilot-linux-amd64.tar.gz"
                sha256 "${LX}"
              end
            end

            def install
              bin.install "daemon" => "pilot-daemon"
              bin.install "pilotctl" => "pilotctl"
              bin.install "updater" => "pilot-updater"
            end

            def post_install
              (var/"pilot").mkpath
              config_dir = Pathname.new(Dir.home)/".pilot"
              config_dir.mkpath
              (config_dir/"bin").mkpath
              (config_dir/"bin/.pilot-version").write "v#{version}\n"
            end

            def caveats
              <<~EOS
                Get started:
                  pilotctl daemon start --hostname my-agent --email you@example.com
                  pilotctl info
                Docs: https://pilotprotocol.network/docs
              EOS
            end

            service do
              run [opt_bin/"pilot-daemon", "-socket", "/tmp/pilot.sock", "-encrypt"]
              keep_alive crashed: true
              log_path var/"log/pilot-daemon.log"
              error_log_path var/"log/pilot-daemon.log"
            end

            test do
              assert_match "pilotctl", shell_output("#{bin}/pilotctl --help 2>&1", 0)
            end
          end
          RUBY
          sed -i 's/^          //' pilotprotocol.rb
          cat pilotprotocol.rb

          CONTENT=$(base64 -w 0 pilotprotocol.rb)
          SHA=$(gh api "repos/${TAP_REPO}/contents/${FORMULA_PATH}" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api "repos/${TAP_REPO}/contents/${FORMULA_PATH}" -X PUT \
              -f message="pilotprotocol ${TAG}" -f content="$CONTENT" -f sha="$SHA"
          else
            gh api "repos/${TAP_REPO}/contents/${FORMULA_PATH}" -X PUT \
              -f message="pilotprotocol ${TAG}" -f content="$CONTENT"
          fi
          echo "Updated ${TAP_REPO}/${FORMULA_PATH} -> ${TAG}"

      # --- Surface failures -------------------------------------------------
      - name: Fan-out gate
        if: always()
        run: |
          echo "PyPI dispatch : ${{ steps.pypi.outcome }}"
          echo "npm dispatch  : ${{ steps.npm.outcome }}"
          echo "Homebrew      : ${{ steps.brew.outcome }}"
          {
            echo "## Downstream fan-out (${{ steps.ver.outputs.tag }})"
            echo "| Channel | Result |"
            echo "|---------|--------|"
            echo "| PyPI (sdk-python dispatch) | ${{ steps.pypi.outcome }} |"
            echo "| npm (sdk-node dispatch)    | ${{ steps.npm.outcome }} |"
            echo "| Homebrew (tap formula)     | ${{ steps.brew.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.pypi.outcome }}" != "success" ] || \
             [ "${{ steps.npm.outcome }}" != "success" ] || \
             [ "${{ steps.brew.outcome }}" != "success" ]; then
            echo "::error::one or more downstream channels failed to dispatch/update"
            exit 1
          fi
