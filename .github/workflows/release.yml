# ----------------------------------------------------------------------------
# Releases continue from this repo as normal — both before and after the
# planned move to `pilot-protocol/`. This comment is just a reminder for
# migration day; it does NOT gate any release.
#
# Why the reminder: GitHub repo transfers do not carry secrets across orgs.
# The current setup only needs GITHUB_TOKEN (auto-issued), so a transfer
# today would not break anything. But future work will re-introduce
# secrets, and they must be re-created on the destination org BEFORE the
# transfer flips DNS — otherwise the first release after the move silently
# falls back to no-op or fails.
#
# Pending (not blocking releases now — will block IF the linked work
# lands before the org migration):
#
#   HOMEBREW_TAP_TOKEN        - re-introduced when Homebrew auto-publish
#                                returns. Prefer a GitHub App over a PAT
#                                via `actions/create-github-app-token@v1`.
#   NPM_TOKEN                 - if PILOT-203 lands sdk-node auto-publish.
#   PYPI_TOKEN                - if PILOT-203 lands sdk-python auto-publish.
#   COSIGN_KEY / COSIGN_PASS  - if PILOT-114 lands updater binary signing.
#
# Migration steps (when the day comes):
#   1. List secrets on the source org with `gh secret list --repo <src>`.
#   2. For each non-auto-issued secret, recreate it on the destination
#      using the original cleartext value (GitHub never reveals existing
#      secret values).
#   3. Transfer the repo via Settings → "Transfer ownership" or
#      `gh api repos/<src>/transfer -f new_owner=<dst>`.
#   4. Re-verify a release tag triggers this workflow successfully.
#
# Track the migration in the org-move runbook. Do NOT delete this comment
# until either: (a) the migration has completed and every reintroduced
# secret is wired against the destination org, or (b) auto-publish and
# binary signing have been formally retired.
# ----------------------------------------------------------------------------

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build all binaries
        run: make build

      - name: Unit tests
        # Skip the heaviest integration / stress tests in the release
        # gate — they collectively consume ~6 min of wall clock and
        # serialize the -parallel 4 slots on Ubuntu CI, pushing the
        # whole suite past the 20-min ceiling. They still run nightly
        # in a separate workflow (TODO: add tests-stress.yml) and locally
        # via `go test ./tests/`. Skipped tests don't cover v1.10.1's
        # new code (heartbeat fix is in pkg/daemon unit tests; compat
        # mode is in tests/compat/ — a separate package).
        run: |
          go test -parallel 4 -count=1 -timeout 900s \
            -skip 'TestMultipleLargeWrites|TestConcurrentDialEncryptDecrypt|TestHTTPPrivateWithTrust|TestInviteInboxCapEnforced|TestConnectionLimits|TestRC6PeerRestartRecoveryEndToEnd|TestEndToEndRelay|TestNameserverOverwriteA|TestNameserverPersistence|TestNameserverRegisterN|TestNameserver$' \
            ./tests/ ./pkg/beacon/

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          BINS="daemon pilotctl gateway registry beacon rendezvous nameserver updater"
          mkdir -p dist
          for bin in $BINS; do
            echo "Building $bin for ${{ matrix.goos }}/${{ matrix.goarch }}..."
            go build -ldflags "$LDFLAGS" -o dist/$bin ./cmd/$bin
          done

      # Ad-hoc codesign + drop quarantine on darwin builds so downloaded
      # binaries don't trigger "killed: 9" or Gatekeeper "cannot be opened
      # because Apple cannot check it for malicious software". Ad-hoc
      # signing is enough to make the binary launch — full notarization
      # would need APPLE_ID + APP_SPECIFIC_PASSWORD secrets and a paid
      # developer cert; out of scope for this release.
      - name: macOS ad-hoc codesign + strip quarantine
        if: matrix.goos == 'darwin'
        run: |
          for bin in dist/*; do
            echo "codesigning $bin..."
            codesign --force --deep --sign - "$bin"
            xattr -cr "$bin" || true
          done
          for bin in dist/*; do
            codesign -dv "$bin" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" | head -1
          done

      - name: Smoke test binaries
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64' || matrix.goos == 'darwin'
        run: |
          echo "=== Binary smoke tests ==="
          for bin in dist/*; do
            name=$(basename $bin)
            # Verify it's a valid executable
            file $bin
            # Version flag check (all binaries should accept -h without crashing)
            timeout 5 $bin -h 2>&1 || true
            echo "  ✓ $name"
          done

          echo ""
          echo "=== Registry start/stop test ==="
          dist/registry -addr 127.0.0.1:0 &
          REG_PID=$!
          sleep 1
          kill $REG_PID 2>/dev/null && echo "  ✓ registry starts and stops cleanly"

          echo ""
          echo "=== Daemon help test ==="
          dist/daemon -h 2>&1 | head -5
          echo "  ✓ daemon shows help"

          echo ""
          echo "=== pilotctl version test ==="
          dist/pilotctl version 2>&1 || dist/pilotctl -h 2>&1 | head -3
          echo "  ✓ pilotctl responds"

      - name: Package archive
        run: |
          ARCHIVE="pilot-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf $ARCHIVE -C dist .
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  harness:
    name: Integration harness
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download linux/amd64 binaries
        uses: actions/download-artifact@v4
        with:
          name: pilot-linux-amd64

      - name: Extract binaries
        run: |
          mkdir -p bin
          tar -xzf pilot-linux-amd64.tar.gz -C bin
          chmod +x bin/*

      - name: End-to-end harness
        run: |
          set -e
          echo "=== Starting registry ==="
          bin/registry -addr 127.0.0.1:19000 -log-level error &
          REG_PID=$!
          sleep 1

          echo "=== Starting beacon ==="
          bin/beacon -registry-addr 127.0.0.1:19000 -listen :19001 -log-level error &
          BEACON_PID=$!
          sleep 1

          echo "=== Starting daemon A ==="
          PILOT_HOME=$(mktemp -d)
          bin/daemon -registry 127.0.0.1:19000 -beacon 127.0.0.1:19001 \
            -hostname harness-a -home "$PILOT_HOME/a" -log-level error &
          DA_PID=$!
          sleep 2

          echo "=== Starting daemon B ==="
          bin/daemon -registry 127.0.0.1:19000 -beacon 127.0.0.1:19001 \
            -hostname harness-b -home "$PILOT_HOME/b" -log-level error &
          DB_PID=$!
          sleep 2

          echo "=== Verify nodes registered ==="
          # pilotctl info via daemon A
          PILOT_SOCK="$PILOT_HOME/a/pilot.sock" bin/pilotctl info --json 2>&1 | head -20
          echo "  ✓ daemon A responds to info"

          PILOT_SOCK="$PILOT_HOME/b/pilot.sock" bin/pilotctl info --json 2>&1 | head -20
          echo "  ✓ daemon B responds to info"

          echo "=== Health check ==="
          PILOT_SOCK="$PILOT_HOME/a/pilot.sock" bin/pilotctl health --json 2>&1 | head -20
          echo "  ✓ daemon A health OK"

          echo "=== Teardown ==="
          kill $DA_PID $DB_PID $BEACON_PID $REG_PID 2>/dev/null || true
          wait $DA_PID $DB_PID $BEACON_PID $REG_PID 2>/dev/null || true
          rm -rf "$PILOT_HOME"
          echo "  ✓ all processes stopped cleanly"
          echo ""
          echo "=== HARNESS PASSED ==="

  release:
    name: Create release
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

  # ----------------------------------------------------------------------------
  # publish-manifest
  #
  # Regenerates `pilotprotocol.network/.well-known/latest.json` from the tag we
  # just shipped, then hands it off to `pilot-protocol/website` via
  # `repository_dispatch`. The website side commits the JSON to main, which
  # triggers the Cloudflare Pages deploy.
  #
  # The manifest is the single source of truth that every install surface
  # (install.sh, Homebrew formula, SDK release helpers) reads to decide which
  # version is current. Failing here does NOT roll the release back — the
  # GitHub release is already live — but it does mean install.sh will keep
  # serving the old tag until the manifest is republished. The step is best-
  # effort and prints a clear hint when the dispatch token is missing.
  # ----------------------------------------------------------------------------
  publish-manifest:
    name: Publish version manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Build manifest JSON from this release
        id: build
        env:
          TAG: ${{ github.ref_name }}
          IS_PRE: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        run: |
          # Pull the just-published checksums.txt directly from the GitHub
          # release (it landed there in the previous job).
          curl -fsSL -o checksums.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/checksums.txt"

          sha_for() {
            grep " $1\$" checksums.txt | awk '{print $1}'
          }

          DARWIN_AMD64=$(sha_for "pilot-darwin-amd64.tar.gz")
          DARWIN_ARM64=$(sha_for "pilot-darwin-arm64.tar.gz")
          LINUX_AMD64=$(sha_for "pilot-linux-amd64.tar.gz")
          LINUX_ARM64=$(sha_for "pilot-linux-arm64.tar.gz")

          # Refuse to publish a manifest with missing checksums — install.sh
          # would silently skip verification.
          for v in "$DARWIN_AMD64" "$DARWIN_ARM64" "$LINUX_AMD64" "$LINUX_ARM64"; do
            if [ -z "$v" ]; then
              echo "error: checksums.txt missing one or more platform entries"
              cat checksums.txt
              exit 1
            fi
          done

          # When the new tag is a prerelease, leave latest_stable alone and
          # bump only latest_prerelease + channels.edge. The website receiver
          # merges into the existing manifest.
          if [ "$IS_PRE" = "true" ]; then
            STABLE="" ; EDGE="$TAG"
          else
            STABLE="$TAG" ; EDGE="$TAG"
          fi

          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          OWNER_REPO="${GITHUB_REPOSITORY}"

          cat > manifest.json <<EOF
          {
            "\$schema": "https://pilotprotocol.network/.well-known/latest.schema.json",
            "updated_at": "${UPDATED_AT}",
            "tag": "${TAG}",
            "is_prerelease": ${IS_PRE},
            "proposed_stable": "${STABLE}",
            "proposed_edge": "${EDGE}",
            "release_notes_url": "https://github.com/${OWNER_REPO}/releases/tag/${TAG}",
            "homebrew_formula_url": "https://github.com/TeoSlayer/homebrew-pilot/raw/main/Formula/pilotprotocol.rb",
            "platforms": {
              "darwin-amd64": { "url": "https://github.com/${OWNER_REPO}/releases/download/${TAG}/pilot-darwin-amd64.tar.gz", "sha256": "${DARWIN_AMD64}" },
              "darwin-arm64": { "url": "https://github.com/${OWNER_REPO}/releases/download/${TAG}/pilot-darwin-arm64.tar.gz", "sha256": "${DARWIN_ARM64}" },
              "linux-amd64":  { "url": "https://github.com/${OWNER_REPO}/releases/download/${TAG}/pilot-linux-amd64.tar.gz",  "sha256": "${LINUX_AMD64}"  },
              "linux-arm64":  { "url": "https://github.com/${OWNER_REPO}/releases/download/${TAG}/pilot-linux-arm64.tar.gz",  "sha256": "${LINUX_ARM64}"  }
            }
          }
          EOF
          cat manifest.json

          # Escape for JSON embedding in the dispatch payload.
          PAYLOAD=$(jq -c '{event_type:"manifest-update", client_payload:{manifest:.}}' manifest.json)
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Dispatch to website
        env:
          # SHOCKWAVE_DISPATCH_TOKEN must have `repository_dispatch` scope on
          # pilot-protocol/website. Prefer a GitHub App token over a PAT —
          # see actions/create-github-app-token@v1.
          SHOCKWAVE_TOKEN: ${{ secrets.SHOCKWAVE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SHOCKWAVE_TOKEN" ]; then
            echo "::warning::SHOCKWAVE_DISPATCH_TOKEN secret unset — skipping manifest dispatch."
            echo "Action required: set the secret and re-run this workflow to publish ${{ github.ref_name }}."
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SHOCKWAVE_TOKEN}" \
            "https://api.github.com/repos/pilot-protocol/website/dispatches" \
            -d '${{ steps.build.outputs.payload }}')
          if [ "$HTTP_CODE" != "204" ]; then
            echo "dispatch failed (HTTP $HTTP_CODE):"
            cat /tmp/resp
            exit 1
          fi
          echo "manifest dispatch accepted (HTTP 204)"

  # ----------------------------------------------------------------------------
  # notify-orchestrator
  #
  # The hardcoded shockwave fan-out has been superseded by the central
  # orchestrator at .github/workflows/orchestrator.yml. Instead of release.yml
  # knowing about every downstream consumer, it just announces "web4 shipped
  # vX.Y.Z" and the orchestrator (which reads .github/deps.json) computes the
  # reverse-transitive closure and dispatches per-target bumps.
  #
  # Soft-fail: missing token emits a warning and exits 0; release flow not
  # blocked.
  # ----------------------------------------------------------------------------
  notify-orchestrator:
    name: Notify orchestrator
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Emit package-released
        env:
          TOKEN: ${{ secrets.SHOCKWAVE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
          IS_PRE: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SHOCKWAVE_DISPATCH_TOKEN unset — orchestrator not notified."
            exit 0
          fi
          payload=$(jq -nc --arg tag "$TAG" --argjson pre "$IS_PRE" \
            '{event_type:"package-released", client_payload:{package:"web4", version:$tag, is_prerelease:$pre}}')
          HTTP_CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "$payload")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "orchestrator notify failed (HTTP $HTTP_CODE):"
            cat /tmp/resp
            exit 1
          fi
          echo "orchestrator notified: web4 ${TAG} (is_prerelease=${IS_PRE})"
