name: refresh-deps-graph

# Auto-regenerates .github/deps.json from the live state of every Pilot
# Protocol repo's go.mod / package.json / Package.swift. The orchestrator
# (orchestrator.yml) reads deps.json to compute cascade closures, so
# keeping it in sync with reality is what makes the cascade reliable.
#
# Triggers:
#   - schedule: hourly. Catches edges added to siblings between explicit pushes.
#   - workflow_dispatch: manual rerun (e.g. just after merging a structural PR).
#   - repository_dispatch deps-touched: every sibling's CI fires this when its
#     go.mod changes. Faster than waiting for the hourly cron.
#
# When the regen produces a diff against the committed file, this workflow
# opens (or updates) a PR titled "chore(deps): refresh dependency graph" so
# the change is reviewable. Auto-commit-to-main is intentionally NOT enabled —
# changes to deps.json affect orchestrator behavior org-wide.
#
# Required token:
#   GITHUB_TOKEN is enough for the read paths (gh repo list, raw file fetch
#   on public repos). The PR-open step also uses GITHUB_TOKEN.

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [deps-touched]

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate deps.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build-deps.py
          if git diff --quiet .github/deps.json; then
            echo "deps.json unchanged — nothing to do."
            echo "CHANGED=0" >> "$GITHUB_ENV"
          else
            echo "deps.json changed; will open or update PR."
            echo "CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: Open / update PR
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="auto/deps-graph-refresh"
          git config user.name  "pilot-deps-bot"
          git config user.email "deps-bot@pilotprotocol.network"
          git checkout -B "$BRANCH"
          git add .github/deps.json
          git commit -m "chore(deps): refresh dependency graph" \
                     -m "Regenerated by scripts/build-deps.py from the current go.mod / package.json / Package.swift of every Pilot Protocol repo. Review before merging — these edges drive orchestrator cascade decisions."
          git push --force-with-lease origin "$BRANCH"

          # If a PR is already open, leave it (force-push updated it).
          existing=$(gh pr list --head "$BRANCH" --json number -q '.[0].number' || true)
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore(deps): refresh dependency graph" \
              --body "Automated regeneration of \`.github/deps.json\` from current sibling manifests. See diff for any added/removed edges.

This PR is auto-rebased on every schedule tick — closing it will block all subsequent refreshes; instead, merge or request changes." \
              --head "$BRANCH" \
              --base main
          else
            echo "Existing PR #$existing updated."
          fi
