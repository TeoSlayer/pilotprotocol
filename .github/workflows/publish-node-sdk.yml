name: Publish Node SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v, e.g. 1.9.1)'
        required: true
        type: string
      prerelease:
        description: 'Treat as prerelease (skip publish; build only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  PILOT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
  PILOT_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease }}

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  build-packages:
    needs: test-sdk
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from release tag or workflow input
        shell: bash
        run: |
          VERSION="${PILOT_VERSION}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_ENV
          cd sdk/node
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "SDK version: $VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build binaries
        shell: bash
        run: |
          cd sdk/node
          chmod +x scripts/build-binaries.sh
          ./scripts/build-binaries.sh

      - name: Install and build TypeScript
        working-directory: sdk/node
        run: |
          npm ci
          npm run build

      - name: Verify package contents
        working-directory: sdk/node
        run: |
          echo "Package contents:"
          npm pack --dry-run
          echo ""
          echo "Built binary subdirs:"
          ls -lh bin/

      # Upload only the platform-specific binary subdir; the publish job
      # downloads both and merges them into a single multi-platform npm package.
      - name: Upload platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: node-bin-${{ matrix.platform }}
          path: sdk/node/bin/
          retention-days: 7

      # Upload the full package layout (JS + bin/ + bin-stubs) once — the
      # Linux runner's copy is the publish base; macOS just contributes its
      # bin/ subdir to the merge.
      - name: Upload full package (Linux base)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-base
          path: sdk/node/
          retention-days: 7

  publish:
    needs: build-packages
    if: ${{ !(inputs.prerelease || github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download package base (Linux build)
        uses: actions/download-artifact@v4
        with:
          name: npm-package-base
          path: sdk/node-pkg

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: node-bin-macos
          path: sdk/node-bin-macos

      - name: Merge macOS binaries into package
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Sanity: linux base must have at least one platform subdir.
          if ! ls sdk/node-pkg/bin/*/ >/dev/null 2>&1; then
            echo "ERROR: linux base package has no platform subdirs in bin/"
            ls -la sdk/node-pkg/bin/ || true
            exit 1
          fi

          # Sanity: macOS artifact must have at least one platform subdir.
          mac_subs=( sdk/node-bin-macos/*/ )
          if [ ${#mac_subs[@]} -eq 0 ]; then
            echo "ERROR: macOS artifact has no platform subdirs"
            ls -la sdk/node-bin-macos/ || true
            exit 1
          fi

          # Linux base already contains bin/<linux subdir>/. Layer in the
          # macOS subdirs so the published package is multi-platform.
          for sub in "${mac_subs[@]}"; do
            name=$(basename "$sub")
            target="sdk/node-pkg/bin/$name"
            if [ -d "$target" ]; then
              echo "  WARNING: $target already exists in linux base — overwriting"
              rm -rf "$target"
            fi
            echo "  merging bin/$name"
            cp -R "$sub" "$target"
          done

          echo ""
          echo "Final bin/ layout:"
          find sdk/node-pkg/bin -maxdepth 2 | sort
          echo ""
          echo "Files included by npm pack:"
          cd sdk/node-pkg && npm pack --dry-run 2>&1 | grep -E "(linux|darwin|\.(so|dylib))" | head -40

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: extract-version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('sdk/node-pkg/package.json', 'utf8')).version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if version exists on npm
        id: check-npm
        run: |
          VERSION=${{ steps.extract-version.outputs.version }}
          if npm view pilotprotocol@$VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on npm"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION does not exist on npm"
          fi

      - name: Publish to npm
        if: steps.check-npm.outputs.exists == 'false'
        working-directory: sdk/node-pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm publish --access public

      - name: Skip publish - version exists
        if: steps.check-npm.outputs.exists == 'true'
        run: echo "Skipping publish - version already exists on npm"

      - name: Create summary
        run: |
          echo "## Node SDK Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.extract-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Install:** \`npm install pilotprotocol\`" >> $GITHUB_STEP_SUMMARY
          echo "**npm:** https://www.npmjs.com/package/pilotprotocol" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms bundled:** linux-amd64, darwin-arm64" >> $GITHUB_STEP_SUMMARY

  test-install:
    needs: publish
    if: ${{ !(inputs.prerelease || github.event.release.prerelease) }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for npm propagation
        run: sleep 60

      - name: Install and verify
        run: |
          npm install pilotprotocol
          npx pilotctl info 2>&1 | head -1 || true
          node -e "import('pilotprotocol').then(m => console.log('SDK installed, exports:', Object.keys(m)))"
