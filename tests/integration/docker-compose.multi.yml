services:
  rendezvous:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.multi
    container_name: p2p-rendezvous
    hostname: rendezvous
    networks:
      pilot-p2p:
        ipv4_address: 172.29.0.10
    command: >
      pilot-rendezvous
      -registry-addr 0.0.0.0:9000
      -beacon-addr 0.0.0.0:9001
      -http 0.0.0.0:8080
      -log-level info
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/stats >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  agent-a:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.multi
    container_name: p2p-agent-a
    hostname: agent-a
    depends_on:
      rendezvous:
        condition: service_healthy
    networks:
      pilot-p2p:
        ipv4_address: 172.29.0.20
    environment:
      PILOT_REGISTRY: "172.29.0.10:9000"
    command: >
      pilot-daemon
      -registry 172.29.0.10:9000
      -beacon 172.29.0.10:9001
      -hostname agent-a
      -identity /root/.pilot/identity.json
      -email agent-a@p2p.test
      -endpoint 172.29.0.20:4000
      -listen :4000
      -public
      -keepalive 5s
      -log-level info

  agent-b:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.multi
    container_name: p2p-agent-b
    hostname: agent-b
    depends_on:
      rendezvous:
        condition: service_healthy
    networks:
      pilot-p2p:
        ipv4_address: 172.29.0.21
    environment:
      PILOT_REGISTRY: "172.29.0.10:9000"
    command: >
      pilot-daemon
      -registry 172.29.0.10:9000
      -beacon 172.29.0.10:9001
      -hostname agent-b
      -identity /root/.pilot/identity.json
      -email agent-b@p2p.test
      -endpoint 172.29.0.21:4000
      -listen :4000
      -public
      -keepalive 5s
      -log-level info

  runner:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile.multi
    container_name: p2p-runner
    hostname: runner
    depends_on:
      rendezvous:
        condition: service_healthy
      agent-a:
        condition: service_started
      agent-b:
        condition: service_started
    networks:
      pilot-p2p:
        ipv4_address: 172.29.0.30
    volumes:
      - ./results:/results
    command: ["/bin/bash", "/tests/test_p2p.sh"]

networks:
  pilot-p2p:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
