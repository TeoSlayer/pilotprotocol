# Pilot Protocol integration tests — Helm values.
#
# Each test in `tests` becomes a Kubernetes Job. Jobs run in parallel,
# bounded by `parallelism`. Every Job self-destructs after
# `ttlSecondsAfterFinished` seconds (cleanup as policy).
#
# The Job image must already contain the test scripts. Build it with:
#   bash ../../scripts/build-and-push.sh
# or set `image.repository`/`image.tag` to your own.

image:
  repository: localhost:5000/pilot-integration
  tag: iter8
  pullPolicy: IfNotPresent

# Cluster-wide cap on concurrent DooD pods. Applied to the DooD
# indexed Job's .spec.parallelism — a real K8s concurrency gate now
# (iter11 through iter15 set this but the chart ignored it, because
# every test became its own parallelism=1 Job and 231 of them launched
# together). 16 ≈ 4 per node, which the shared node-docker DaemonSet
# handles cleanly; above that we see compose-project contention on
# /var/lib/pilot-docker overlay2.
parallelism: 16

# Cluster-wide cap on concurrent DinD pods. Applied to the DinD
# indexed Job. 4 keeps one privileged dockerd per node, which is
# the containerd boltdb ceiling observed in iter7/iter8 (~5/node
# consistently hung on boltdb-open contention past that).
dindParallelism: 4

# Clean up a finished Job (whether success or fail) after this many
# seconds. Set to 0 to delete immediately, -1 to disable. 300s keeps the
# pod around long enough to grab logs post-mortem without hogging the
# Longhorn ephemeral PVC (freed when the pod terminates).
ttlSecondsAfterFinished: 60

# Per-Job timeout (seconds) — maps to Job.spec.activeDeadlineSeconds.
# Bumped to 3600s (was 1800) because at max concurrency all 200+ jobs
# land on 4 nodes simultaneously; DinD + policy tests routinely take
# 20–30 min under that pressure, leaving zero margin. 108 iter7 jobs
# hit DeadlineExceeded together at the 30-min mark.
activeDeadlineSeconds: 7200

# Restart policy for the Pod. `Never` means a failing test shows up as a
# failed Job. backoffLimit: 1 allows one retry — transient
# FailedAttachVolume / FailedMount errors under storage churn usually
# succeed on the second try.
restartPolicy: Never
backoffLimit: 1

# Privileged: controlled per-Job via `isolation`. DinD-tagged tests
# (NAT suite) get privileged: true automatically; DooD tests rely on
# the privileged node-docker DaemonSet and run unprivileged.
# This field is retained only for compatibility with external
# tooling that reads it — it is NOT referenced by templates.
privileged: true

# Default isolation mode for tests that don't specify `isolation`.
# - "dood": Docker-outside-of-Docker via the node-docker DaemonSet
#           socket. ~210 tests. Cheap to start, shared daemon per node.
# - "dind": Docker-in-Docker inside a privileged pod. ~21 NAT tests
#           that manipulate iptables/conntrack state and MUST have a
#           private netns; host-level iptables collisions under DooD
#           would cross-contaminate parallel NAT runs.
# Override per-test by setting `isolation: dind` on the entry below.
defaultIsolation: dood

# node-docker DaemonSet — long-lived dockerd + compose per node. Every
# DooD-mode Job on a node talks to this pod's socket via hostPath
# /run/pilot-docker/docker.sock. Disable to fall back to all-DinD
# (every Job boots its own dockerd).
nodeDocker:
  enabled: true
  image:
    # Reuses the integration image (which already bundles dockerd +
    # compose + iptables-legacy symlinks). Same tag as the runner, so
    # node-docker rollouts stay in lockstep with the test payload.
    repository: localhost:5000/pilot-integration
    tag: iter8
    pullPolicy: IfNotPresent
  # Schedule one Pod per node. Empty selector = every node.
  nodeSelector: {}
  # dockerd data-root. Defaults to NVMe because eMMC root on Jetson
  # (57G) fills under ~50 concurrent DooD compose projects and the
  # kubelet evicts pods with DiskPressure before image-GC catches up
  # (see PROBLEM-REGISTRY P0-000, iter10 abort 2026-04-22).
  dataRoot: /mnt/nvme/pilot-docker
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 4Gi

# Host dir into which the DaemonSet seeds a read-only source tree for
# DooD Jobs. Each Job hardlink-copies /source → /tests/<name>/ before
# running so compose bind-mount paths resolve identically in the
# runner pod and on the host side of the docker socket.
workspaceHostPath:
  path: /mnt/nvme/pilot-workspace

# Filter. If `only` is set, only tests matching that glob run.
# Examples:
#   only: test_nat_full_cone       (single test, no extension)
#   only: "test_nat_*"             (glob)
# Leave empty to run every test listed below.
only: ""

# Resource requests. Override per-Job if a scenario needs more.
# Sized so the scheduler caps concurrency at ~32 cluster-wide
# (4 nodes × 12 CPU / 1500m = 32 slots). Longhorn CSI saturates
# past ~10 concurrent attaches per node and triggers
# FailedAttachVolume cascades; this cap is the ceiling that keeps
# the attach queue smooth. Measured steady state per pod: ~7m CPU,
# ~275 MiB mem; peak ~350m CPU, ~500 MiB mem — requests are
# deliberately above observed to reserve slots.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# Namespace. Leave empty to deploy into the install namespace.
namespace: ""

# Pin Jobs to a specific node. Useful when the image was imported
# directly into a single node's containerd (pullPolicy: Never workflow).
# Leave empty to let the scheduler pick.
nodeSelector: {}

# DinD's /var/lib/docker is a generic ephemeral PVC, one per pod,
# auto-deleted when the Job's pod terminates. Default: Longhorn
# (NVMe-backed), RWO, 10Gi. Keeps the pod's docker graph off the
# node's 57G eMMC root fs where ephemeral-storage eviction lives.
dindStorage:
  storageClassName: local-path
  size: 2Gi

# Shared read-only volume holding preloaded Docker image tarballs.
# Populated once (see scripts/seed-preloaded-hostpath.sh) into a hostPath
# dir on every node; every Job pod mounts it at /preloaded so the DinD
# daemon can `docker load` common base images + pilot-multi without
# rebuilding or pulling. hostPath is used instead of a Longhorn RWX PVC
# because Longhorn v2 data-engine is disabled on this cluster.
# Set `preloadedHostPath.path: ""` to disable the mount.
preloadedHostPath:
  path: /var/lib/pilot-preloaded

# Legacy PVC-based preload — kept for reference, now unused on Jetson.
# NOTE: Jetson cluster has no RWX SC (Longhorn is disabled, local-path is RWO
# only), so this path is not functional there. hostPath path above is the
# supported mechanism. Value left as local-path for non-Jetson clusters.
preloadedPVC:
  claimName: ""
  storageClassName: local-path
  size: 2Gi

