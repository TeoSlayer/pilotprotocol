{{- if .Values.preloadedPVC.claimName }}
# Shared read-only volume for preloaded Docker image tarballs. One RWX
# Longhorn PVC for the whole suite; every test Job mounts it read-only
# at /preloaded so the in-pod dockerd can `docker load` common base
# images without re-pulling through the mirror each time.
#
# Populate it with scripts/seed-preloaded.sh (one-shot; idempotent —
# the seeder only copies tarballs whose size differs from what's
# already on the volume).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.preloadedPVC.claimName | quote }}
  namespace: {{ include "pilot-integration.namespace" . }}
  labels:
    {{- include "pilot-integration.labels" . | nindent 4 }}
    pilot-integration/role: preloaded-tarballs
  # Keep the PVC across `helm uninstall` so you don't re-seed every
  # run. Delete manually with `kubectl delete pvc {{ .Values.preloadedPVC.claimName }}`
  # when you actually want to rebuild the contents.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: {{ .Values.preloadedPVC.storageClassName | default "longhorn" | quote }}
  resources:
    requests:
      storage: {{ .Values.preloadedPVC.size | default "2Gi" | quote }}
{{- end }}
