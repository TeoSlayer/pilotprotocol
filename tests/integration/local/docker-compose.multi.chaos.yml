# Chaos-capable overlay. Stack with:
#   docker compose -f docker-compose.multi.yml -f docker-compose.multi.chaos.yml up -d
#
# Grants NET_ADMIN so `tc qdisc` / `iptables` can run inside the agent
# containers, enabling packet loss, delay, reorder, and partition tests.
services:
  agent-a:
    cap_add:
      - NET_ADMIN
  agent-b:
    cap_add:
      - NET_ADMIN
    # Mount a small tmpfs at the receive directory so disk-full tests
    # can saturate it without burning host disk. 4 MiB fits a 2 MiB
    # send-file with margin for daemon metadata; ballast headroom is
    # enforced by the test harness.
    tmpfs:
      - /root/.pilot/received:size=4m
  rendezvous:
    cap_add:
      - NET_ADMIN
