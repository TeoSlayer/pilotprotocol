# Rendezvous behind NAT. A deliberately weird setup: rendezvous sits
# on a private subnet behind a gateway that DNATs its public ports
# (9000, 9001, 8080) inward. Tests whether the bootstrap works when
# the rendezvous is itself not on a public IP.
#
# Subnet prefixes are templated via NAT_PUB / NAT_PRV (two-octet form,
# e.g. 192.0.2). Parallel runners override to non-overlapping prefixes.
services:
  nat-gw-rend:
    build: {context: ., dockerfile: Dockerfile.nat-gw}
    hostname: nat-gw-rend
    cap_add: [NET_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      NAT_MODE: "cone"
      PUBLIC_SUBNET: "${NAT_PUB:-192.0.2}"
      PRIVATE_SUBNET: "${NAT_PRV:-198.51.100}"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
      NAT_PRV: "${NAT_PRV:-198.51.100}"
    networks:
      private-rend: {ipv4_address: "${NAT_PRV:-198.51.100}.2"}
      public: {ipv4_address: "${NAT_PUB:-192.0.2}.30"}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        /nat-gw.sh &
        GWPID=$$!
        sleep 1
        # Detect public/private iface by matching on the templated
        # prefix. awk regex uses dots escaped at bash-expansion time.
        PUB_RE=$$(echo "$${NAT_PUB}" | sed 's/\./\\\\./g')
        PRV_RE=$$(echo "$${NAT_PRV}" | sed 's/\./\\\\./g')
        PUBIF=$$(ip -o -4 addr show | awk -v re="^$${PUB_RE}\\\\." '$$4 ~ re {print $$2; exit}')
        PRIVIF=$$(ip -o -4 addr show | awk -v re="^$${PRV_RE}\\\\." '$$4 ~ re {print $$2; exit}')
        iptables -t nat -A PREROUTING -i "$$PUBIF" -p tcp --dport 9000 -j DNAT --to-destination $${NAT_PRV}.10:9000
        iptables -t nat -A PREROUTING -i "$$PUBIF" -p tcp --dport 9001 -j DNAT --to-destination $${NAT_PRV}.10:9001
        iptables -t nat -A PREROUTING -i "$$PUBIF" -p udp --dport 9001 -j DNAT --to-destination $${NAT_PRV}.10:9001
        iptables -t nat -A PREROUTING -i "$$PUBIF" -p tcp --dport 8080 -j DNAT --to-destination $${NAT_PRV}.10:8080
        # SNAT forwarded packets so rendezvous sees our private-side IP
        # as the source. Without this, Docker's bridge silently drops
        # packets whose src IP is outside the private-side subnet.
        iptables -t nat -A POSTROUTING -o "$$PRIVIF" -d $${NAT_PRV}.10 -j MASQUERADE
        wait $$GWPID

  rendezvous:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: rendezvous
    depends_on:
      nat-gw-rend: {condition: service_started}
    cap_add: [NET_ADMIN]
    networks:
      private-rend: {ipv4_address: "${NAT_PRV:-198.51.100}.10"}
    environment:
      NAT_PRV: "${NAT_PRV:-198.51.100}"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        ip route del default 2>/dev/null || true
        ip route add default via $${NAT_PRV}.2
        exec pilot-rendezvous \
          -registry-addr 0.0.0.0:9000 -beacon-addr 0.0.0.0:9001 \
          -http 0.0.0.0:8080 -log-level info
    command: []

  agent-a:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-a
    depends_on:
      rendezvous: {condition: service_started}
    networks:
      public: {ipv4_address: "${NAT_PUB:-192.0.2}.20"}
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.30:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
    command:
      - /bin/bash
      - -c
      - |
        exec pilot-daemon \
          -registry $${NAT_PUB}.30:9000 -beacon $${NAT_PUB}.30:9001 \
          -hostname agent-a -identity /root/.pilot/identity.json \
          -email agent-a@rend.test -endpoint $${NAT_PUB}.20:4000 -listen :4000 \
          -public -keepalive 5s -log-level info

  agent-b:
    image: pilot-multi:latest
    build:
      context: ../../..
      dockerfile: tests/integration/local/Dockerfile.multi
    hostname: agent-b
    depends_on:
      rendezvous: {condition: service_started}
    networks:
      public: {ipv4_address: "${NAT_PUB:-192.0.2}.21"}
    environment:
      PILOT_REGISTRY: "${NAT_PUB:-192.0.2}.30:9000"
      NAT_PUB: "${NAT_PUB:-192.0.2}"
    command:
      - /bin/bash
      - -c
      - |
        exec pilot-daemon \
          -registry $${NAT_PUB}.30:9000 -beacon $${NAT_PUB}.30:9001 \
          -hostname agent-b -identity /root/.pilot/identity.json \
          -email agent-b@rend.test -endpoint $${NAT_PUB}.21:4000 -listen :4000 \
          -public -keepalive 5s -log-level info

networks:
  public:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PUB:-192.0.2}.0/24"}]}
  private-rend:
    driver: bridge
    ipam: {config: [{subnet: "${NAT_PRV:-198.51.100}.0/24"}]}
