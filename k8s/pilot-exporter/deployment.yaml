---
apiVersion: v1
kind: Namespace
metadata:
  name: pilot-integration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilot-exporter
  namespace: pilot-integration
  labels:
    app.kubernetes.io/name: pilot-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pilot-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pilot-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.12-alpine
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir prometheus_client==0.20.0 && \
              exec python /code/exporter.py
          env:
            - name: PILOT_STATS_URL
              value: "http://34.71.57.205:3000/api/stats"
            - name: SCRAPE_INTERVAL_SECONDS
              value: "5"
            - name: SCRAPE_TIMEOUT_SECONDS
              value: "4"
            - name: LISTEN_PORT
              value: "8080"
          ports:
            - name: metrics
              containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /code
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: code
          configMap:
            name: pilot-exporter-code
---
apiVersion: v1
kind: Service
metadata:
  name: pilot-exporter
  namespace: pilot-integration
  labels:
    app.kubernetes.io/name: pilot-exporter
spec:
  selector:
    app.kubernetes.io/name: pilot-exporter
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
