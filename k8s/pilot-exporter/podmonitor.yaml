---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pilot-exporter
  namespace: pilot-integration
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pilot-exporter
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
