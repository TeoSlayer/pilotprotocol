---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: pilot-integration
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.9.0
          args:
            - --web.listen-address=:9091
            - --persistence.file=/data/pushgateway.data
            - --persistence.interval=30s
          ports:
            - name: http
              containerPort: 9091
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: pilot-integration
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: pilot-integration
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [pilot-integration]
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      honorLabels: true
