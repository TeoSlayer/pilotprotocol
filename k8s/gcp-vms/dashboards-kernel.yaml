---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pilot-gcp-kernel-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Pilot GCP"
data:
  pilot-gcp-kernel.json: |
    {
      "uid": "pilot-gcp-kernel",
      "title": "Pilot GCP - Kernel & packet path",
      "tags": ["pilot", "gcp", "kernel", "softnet", "psi"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "row", "title": "Softnet — kernel packet processing (per CPU)", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0}},
        {"id": 2, "type": "timeseries", "title": "softnet_dropped/s (packets dropped before kernel processing)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 1},
         "fieldConfig": {"defaults": {"unit": "pps", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_softnet_dropped_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},
        {"id": 3, "type": "timeseries", "title": "softnet_times_squeezed/s (NAPI budget exhausted → more work available but stopped)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 1},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_softnet_times_squeezed_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},
        {"id": 4, "type": "timeseries", "title": "softnet_processed/s (packets serviced by softirq)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 9},
         "fieldConfig": {"defaults": {"unit": "pps", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_softnet_processed_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},
        {"id": 5, "type": "timeseries", "title": "softnet_backlog_len (current queued packets, summed across CPUs)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 9},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}},
         "targets": [{"expr": "sum by (vm) (node_softnet_backlog_len{service=\"pilot-iap-scraper\"})", "legendFormat": "{{vm}}"}]},
        {"id": 6, "type": "timeseries", "title": "softnet_flow_limit/s (per-flow packet limit hit, early drop)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 17},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_softnet_flow_limit_count_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},
        {"id": 7, "type": "timeseries", "title": "softnet_received_rps/s (packets routed via RPS to another CPU)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 17},
         "fieldConfig": {"defaults": {"unit": "pps", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_softnet_received_rps_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},

        {"id": 10, "type": "row", "title": "Pressure Stall Info (PSI) — fraction of time some/any task waiting on resource", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 25}},
        {"id": 11, "type": "timeseries", "title": "CPU PSI waiting (any task waiting for CPU, seconds/sec)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 26},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"expr": "rate(node_pressure_cpu_waiting_seconds_total{service=\"pilot-iap-scraper\"}[5m])", "legendFormat": "{{vm}}"}]},
        {"id": 12, "type": "timeseries", "title": "Memory PSI stalled (all tasks blocked on memory, seconds/sec)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 26},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"expr": "rate(node_pressure_memory_stalled_seconds_total{service=\"pilot-iap-scraper\"}[5m])", "legendFormat": "{{vm}}"}]},
        {"id": 13, "type": "timeseries", "title": "Memory PSI waiting (any task waiting on memory, seconds/sec)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 34},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"expr": "rate(node_pressure_memory_waiting_seconds_total{service=\"pilot-iap-scraper\"}[5m])", "legendFormat": "{{vm}}"}]},
        {"id": 14, "type": "timeseries", "title": "IO PSI stalled (all tasks blocked on IO, seconds/sec)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 34},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"expr": "rate(node_pressure_io_stalled_seconds_total{service=\"pilot-iap-scraper\"}[5m])", "legendFormat": "{{vm}}"}]},
        {"id": 15, "type": "timeseries", "title": "IO PSI waiting (any task waiting on IO, seconds/sec)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 42},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "targets": [{"expr": "rate(node_pressure_io_waiting_seconds_total{service=\"pilot-iap-scraper\"}[5m])", "legendFormat": "{{vm}}"}]},

        {"id": 20, "type": "row", "title": "Scheduler (schedstat) — runqueue latency per CPU", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 50}},
        {"id": 21, "type": "timeseries", "title": "Runqueue wait (sched_waiting_seconds/sec, summed across CPUs)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 51},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}},
         "description": "Rate of seconds tasks spent waiting in runqueue. Divide by CPU count for per-CPU rate. Sustained values >0.5/CPU = contention.",
         "targets": [{"expr": "sum by (vm) (rate(node_schedstat_waiting_seconds_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},
        {"id": 22, "type": "timeseries", "title": "Running time (sched_running_seconds/sec, summed across CPUs)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 51},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_schedstat_running_seconds_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},
        {"id": 23, "type": "timeseries", "title": "Timeslices/sec (scheduler context switch frequency)",
         "gridPos": {"h": 8, "w": 24, "x": 0, "y": 59},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [{"expr": "sum by (vm) (rate(node_schedstat_timeslices_total{service=\"pilot-iap-scraper\"}[5m]))", "legendFormat": "{{vm}}"}]},

        {"id": 30, "type": "row", "title": "NIC driver & packet-path health", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 67}},
        {"id": 31, "type": "stat", "title": "Interface carrier down (should be 0)",
         "gridPos": {"h": 4, "w": 8, "x": 0, "y": 68},
         "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
         "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
         "targets": [{"expr": "count(node_network_up{service=\"pilot-iap-scraper\",device=\"ens4\"} == 0) or vector(0)", "legendFormat": "interfaces down"}]},
        {"id": 32, "type": "timeseries", "title": "Link flap rate (carrier_up_changes/sec) - any non-zero = flapping",
         "gridPos": {"h": 8, "w": 16, "x": 8, "y": 68},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [{"expr": "sum by (vm, device) (rate(node_network_carrier_up_changes_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}}/{{device}}"}]},
        {"id": 33, "type": "timeseries", "title": "Transmit queue length (tx_queue_len, per device)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 76},
         "fieldConfig": {"defaults": {"unit": "short", "min": 0}},
         "targets": [{"expr": "node_network_transmit_queue_length{service=\"pilot-iap-scraper\",device=\"ens4\"}", "legendFormat": "{{vm}}/{{device}}"}]},
        {"id": 34, "type": "timeseries", "title": "UDP queues (rx + tx, IPv4+v6 summed per vm)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 76},
         "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}},
         "description": "Bytes queued in UDP socket buffers. rx non-zero = app slow to receive. tx non-zero = NIC slow to drain.",
         "targets": [
           {"expr": "sum by (vm) (node_udp_queues{service=\"pilot-iap-scraper\",queue=\"rx\"})", "legendFormat": "{{vm}} rx"},
           {"expr": "sum by (vm) (node_udp_queues{service=\"pilot-iap-scraper\",queue=\"tx\"})", "legendFormat": "{{vm}} tx"}
         ]},
        {"id": 35, "type": "timeseries", "title": "NIC receive errors + drops + frame errs (rate)",
         "gridPos": {"h": 8, "w": 12, "x": 0, "y": 84},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [
           {"expr": "sum by (vm) (rate(node_network_receive_errs_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} rx_errs"},
           {"expr": "sum by (vm) (rate(node_network_receive_drop_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} rx_drop"},
           {"expr": "sum by (vm) (rate(node_network_receive_frame_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} rx_frame"}
         ]},
        {"id": 36, "type": "timeseries", "title": "NIC transmit errors + drops + collisions + carrier errs (rate)",
         "gridPos": {"h": 8, "w": 12, "x": 12, "y": 84},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [
           {"expr": "sum by (vm) (rate(node_network_transmit_errs_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} tx_errs"},
           {"expr": "sum by (vm) (rate(node_network_transmit_drop_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} tx_drop"},
           {"expr": "sum by (vm) (rate(node_network_transmit_carrier_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} tx_carrier"},
           {"expr": "sum by (vm) (rate(node_network_transmit_colls_total{service=\"pilot-iap-scraper\",device=\"ens4\"}[5m]))", "legendFormat": "{{vm}} tx_colls"}
         ]},

        {"id": 40, "type": "row", "title": "Per-CPU breakdown (find hot cores)", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 92}},
        {"id": 41, "type": "timeseries", "title": "Per-CPU utilization (1 - idle) for $vm - pick from table",
         "gridPos": {"h": 10, "w": 24, "x": 0, "y": 93},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "description": "Shows every core separately so you can spot a single pinned core (single-threaded bottleneck) vs. even spread. Uses $vm template.",
         "targets": [{"expr": "1 - rate(node_cpu_seconds_total{service=\"pilot-iap-scraper\",vm=\"$vm\",mode=\"idle\"}[5m])", "legendFormat": "cpu{{cpu}}"}]},
        {"id": 42, "type": "timeseries", "title": "Per-CPU softirq time (rate, seconds/sec) for $vm",
         "gridPos": {"h": 10, "w": 12, "x": 0, "y": 103},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
         "description": "Per-core softirq load. Uneven softirq (1 core at 100%, others idle) means NIC RSS is not spreading interrupts.",
         "targets": [{"expr": "rate(node_cpu_seconds_total{service=\"pilot-iap-scraper\",vm=\"$vm\",mode=\"softirq\"}[5m])", "legendFormat": "cpu{{cpu}}"}]},
        {"id": 43, "type": "timeseries", "title": "Per-CPU softnet processed/sec for $vm",
         "gridPos": {"h": 10, "w": 12, "x": 12, "y": 103},
         "fieldConfig": {"defaults": {"unit": "pps", "min": 0}},
         "targets": [{"expr": "rate(node_softnet_processed_total{service=\"pilot-iap-scraper\",vm=\"$vm\"}[5m])", "legendFormat": "cpu{{cpu}}"}]},
        {"id": 44, "type": "timeseries", "title": "Per-CPU softnet dropped/sec for $vm (NON-ZERO = kernel dropping)",
         "gridPos": {"h": 10, "w": 12, "x": 0, "y": 113},
         "fieldConfig": {"defaults": {"unit": "pps", "min": 0}},
         "targets": [{"expr": "rate(node_softnet_dropped_total{service=\"pilot-iap-scraper\",vm=\"$vm\"}[5m])", "legendFormat": "cpu{{cpu}}"}]},
        {"id": 45, "type": "timeseries", "title": "Per-CPU softnet times_squeezed/sec for $vm (budget exhausted)",
         "gridPos": {"h": 10, "w": 12, "x": 12, "y": 113},
         "fieldConfig": {"defaults": {"unit": "ops", "min": 0}},
         "targets": [{"expr": "rate(node_softnet_times_squeezed_total{service=\"pilot-iap-scraper\",vm=\"$vm\"}[5m])", "legendFormat": "cpu{{cpu}}"}]},
        {"id": 46, "type": "timeseries", "title": "Per-CPU schedstat wait sec/sec for $vm (runqueue latency per core)",
         "gridPos": {"h": 10, "w": 24, "x": 0, "y": 123},
         "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}},
         "description": "Rate of time tasks waited in runqueue on each CPU. Values approaching 1.0 = that CPU is oversubscribed.",
         "targets": [{"expr": "rate(node_schedstat_waiting_seconds_total{service=\"pilot-iap-scraper\",vm=\"$vm\"}[5m])", "legendFormat": "cpu{{cpu}}"}]},

        {"id": 50, "type": "row", "title": "Cross-VM: hot-CPU ranking", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 133}},
        {"id": 51, "type": "table", "title": "Max-per-VM CPU softirq% (spot imbalanced NIC IRQ routing)",
         "gridPos": {"h": 10, "w": 12, "x": 0, "y": 134},
         "fieldConfig": {"defaults": {"unit": "percentunit"}},
         "targets": [{"expr": "max by (vm) (rate(node_cpu_seconds_total{service=\"pilot-iap-scraper\",mode=\"softirq\"}[5m]))", "instant": true, "format": "table"}]},
        {"id": 52, "type": "table", "title": "Max-per-VM CPU utilization (any core pinned?)",
         "gridPos": {"h": 10, "w": 12, "x": 12, "y": 134},
         "fieldConfig": {"defaults": {"unit": "percentunit"}},
         "targets": [{"expr": "max by (vm) (1 - rate(node_cpu_seconds_total{service=\"pilot-iap-scraper\",mode=\"idle\"}[5m]))", "instant": true, "format": "table"}]}
      ],
      "templating": {
        "list": [
          {
            "name": "vm",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(up{service=\"pilot-iap-scraper\"}, vm)",
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "current": {"text": "pilot-rendezvous", "value": "pilot-rendezvous"}
          }
        ]
      }
    }
